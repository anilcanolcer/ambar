name: Ambar imzalı sürüm
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ambar-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - name: Ambar güncelleme yapılandırmasını hazırla
        env:
          AMBAR_UPDATER_PUBLIC_KEY: ${{ vars.AMBAR_UPDATER_PUBLIC_KEY }}
          AMBAR_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          AMBAR_REPOSITORY: ${{ github.repository }}
          AMBAR_RELEASE_VERSION: 0.1.${{ github.run_number }}
        run: node scripts/configure-release.mjs
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Ambar v__VERSION__
          releaseBody: Windows kurulum dosyası ve macOS DMG. Ambar, yeni sürümü açılışta ve günlük olarak denetler.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: İmzalı Windows ve macOS güncelleme dosyalarını doğrula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AMBAR_RELEASE_VERSION: 0.1.${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ambar-release"
          gh release download "v$AMBAR_RELEASE_VERSION" --pattern latest.json --dir "$RUNNER_TEMP/ambar-release"
          node -e '
            const fs = require("fs");
            const path = process.env.RUNNER_TEMP + "/ambar-release/latest.json";
            const data = JSON.parse(fs.readFileSync(path, "utf8"));
            const platforms = Object.keys(data.platforms ?? {});
            if (data.version !== process.env.AMBAR_RELEASE_VERSION ||
                !platforms.some(p => p.startsWith("windows-")) ||
                !platforms.some(p => p.startsWith("darwin-"))) {
              throw new Error("Windows veya macOS imzalı güncelleme dosyası eksik.");
            }
            for (const platform of platforms) {
              const item = data.platforms[platform];
              if (!item.url || !item.signature) throw new Error(platform + " imza veya adresi eksik.");
            }
            console.log("Doğrulanan platformlar: " + platforms.join(", "));
          '
          gh release edit "v$AMBAR_RELEASE_VERSION" --draft=false --latest
